<input type="file" id="f" accept="image/png,image/jpeg,image/gif,image/webp" />
<button id="btn">upload thing (jpg, gif, png, and webp supported)</button>
<pre id="res_txt"></pre>

<img id="img" src="../../saint.png" alt="">

<script>
	const IMG_HAS_ORIGINAL = 1 << 0;
	const IMG_HAS_SAMPLE = 1 << 1; 

	btn.onclick = async () => {
		const file = f.files[0];
		if (!file) return;

		res_txt.textContent = "uploading... <3";

		const res = await fetch("/upload", {
			method: "POST",
			body: file,
			cache: "no-store"
		});

		const txt = await res.json();
		console.log(txt)
		const hash = txt.hash;
		let ext= txt.ext;

		let route = 'raw';
		if ((txt.flags & IMG_HAS_SAMPLE) != 0) {
			route = 'sample';
			ext = 'webp';
		}

		res_txt.textContent = "[" + res.status + "]" + ' ~ % ' + hash;
		// haxe redirects any /data requests to our file handling backend
		img.src = `/data/${route}/${hash.slice(0, 2)}/${hash.slice(2, 4)}/${hash}.${ext}`;

		f.value = "";
	};
</script>
